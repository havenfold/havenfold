# Havenfold Kurulum USB'si önyükleme menüsü (RFC-0007 §8.2). Varsayılan seçenek hiçbir şey silmez; yıkıcı seçenekler
# hiçbir zaman varsayılan değildir. Çekirdekler Canonical'ın imzalı çekirdekleridir (shim ve grub değiştirilmedi).
set timeout=15
set default=0
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Diskten başlat" {
	if [ "$grub_platform" = "efi" ]; then
		exit 1
	else
		set root=(hd1)
		chainloader +1
		boot
	fi
}

menuentry "Havenfold kur — bu bilgisayarın diski SİLİNİR" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall 'ds=nocloud;s=/cdrom/nocloud/' ---
	initrd	/casper/initrd
}

menuentry "Havenfold silme modu — emeklilik" {
	set gfxpayload=keep
	linux	/erase-mode/vmlinuz boot=casper live-media-path=/erase-mode toram havenfold.silme=1 systemd.mask=systemd-networkd.service systemd.mask=systemd-resolved.service ipv6.disable=1 ---
	initrd	/erase-mode/initrd
}
