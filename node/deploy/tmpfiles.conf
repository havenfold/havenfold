# /usr/lib/tmpfiles.d/havenfold.conf — RFC-0007 §5 dizinler ve izinler. Yalnız dosya; bu makinede uygulanmaz.
#Tür Yol                                 İzin  Sahip              Grup                Yaş
d     /var/lib/havenfold                  0755  root               root                -
d     /var/lib/havenfold/kutu             0700  havenfold-kutu     havenfold-kutu      -
d     /var/lib/havenfold/isci             0700  havenfold-isci     havenfold-isci      -
d     /var/lib/havenfold/denetci          0700  havenfold-denetci  havenfold-denetci   -
d     /var/lib/havenfold/yetki            0700  root               root                -
d     /var/lib/havenfold/yedek            0755  root               root                -
d     /var/lib/havenfold/yedek/kutu       0700  havenfold-denetci  havenfold-denetci   -
d     /var/lib/havenfold/yedek/isci       0700  havenfold-denetci  havenfold-denetci   -
d     /var/lib/havenfold/gorev-ev         0700  havenfold-task     havenfold-task      -
d     /run/havenfold                      0755  root               root                -
d     /run/havenfold/gorev                2770  havenfold-denetci  havenfold-gorev     -
# havenfold-task'ın podman.socket'i burada dinler (deploy/podman-havenfold.conf); denetçi havenfold-podman grubuyla bağlanır
d     /run/havenfold/podman               0750  havenfold-task     havenfold-podman    -
# RFC-0026 f: rolün dizini çekirdeğin, grubu yönetim; denetçinin çekirdeklere bakan soketleri kendi dizininde
# (çekirdekler havenfold-cekirdek grubuyla bağlanır), yönetim soketi ayrı dizinde
d     /run/havenfold/kutu                 0750  havenfold-kutu     havenfold-yonetim   -
d     /run/havenfold/isci                 0750  havenfold-isci     havenfold-yonetim   -
d     /run/havenfold/denetci              0750  havenfold-denetci  havenfold-cekirdek  -
# denetci-yonetim setgid (2750): denetçi yönetim grubunun üyesi değildir; soketinin grubu dizinden gelir
d     /run/havenfold/denetci-yonetim      2750  havenfold-denetci  havenfold-yonetim   -
# Yetki yardımcısının soketi (havenfold-yetki.socket): yalnız denetçi girer (RFC-0033 §9 l; dosya izniyle yetki)
d     /run/havenfold/yetki                0750  root               havenfold-denetci   -
d     /etc/havenfold                      0755  root               root                -
