# /usr/lib/sysusers.d/havenfold.conf — RFC-0007 §4.1 kullanıcılar ve gruplar. Yalnız dosya; bu makinede uygulanmaz.
#Tür Ad                 Kimlik Açıklama                               Ev
u     havenfold-kutu      -      "Havenfold kutu çekirdeği"             /var/lib/havenfold/kutu
u     havenfold-isci      -      "Havenfold işçi çekirdeği"             /var/lib/havenfold/isci
u     havenfold-denetci   -      "Havenfold denetçi"                    /var/lib/havenfold/denetci
u     havenfold-task      -      "Havenfold görev konteynerleri"        /var/lib/havenfold/gorev-ev
u     havenfold-ekran     -      "Havenfold durum ekranı"               -
g     havenfold-gorev     -
g     havenfold-yonetim   -
g     havenfold-cekirdek  -
# Görev konteynerlerinin Podman API soketi (/run/havenfold/podman/): yalnız sahibi ve denetçi; işçi konteyner başlatamaz
g     havenfold-podman    -
m     havenfold-isci      havenfold-gorev
m     havenfold-denetci   havenfold-gorev
m     havenfold-task      havenfold-gorev
m     havenfold-kutu      tss
m     havenfold-isci      tss
m     havenfold-denetci   tss
# RFC-0026 f: ekran yönetim soketlerinden durum alır; çekirdekler denetçinin soket dizinine bağlanır. Denetçi
# havenfold-yonetim üyesi değildir (açılış güvenlik incelemesi): yönetim grubu çekirdeklerin yönetim soketlerine
# erişir. Yardımcı soketine (/run/havenfold/yetki/) yalnız denetçi, birincil grubu havenfold-denetci ile bağlanır; o
# grubun başka üyesi yoktur (RFC-0033 §9 l: yetki dosya izni ve grup üyeliğiyle)
m     havenfold-ekran     havenfold-yonetim
m     havenfold-kutu      havenfold-cekirdek
m     havenfold-isci      havenfold-cekirdek
m     havenfold-task      havenfold-podman
m     havenfold-denetci   havenfold-podman
