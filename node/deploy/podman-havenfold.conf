# podman-havenfold.conf — havenfold-task kullanıcısının podman.socket'i için ek ayar (RFC-0007 §4.3 "podman.socket,
# havenfold-task kullanıcı birimi"). Yalnız dosya; bu makinede uygulanmaz.
#
# Kurulum yeri: /var/lib/havenfold/gorev-ev/.config/systemd/user/podman.socket.d/havenfold.conf (havenfold-task'ın evi)
#
# Neden: Podman'ın varsayılan soketi /run/user/<uid>/podman/podman.sock'tur; denetçinin birimindeki ProtectHome=yes
# /run/user'ı gizler. Soket /run/havenfold/podman/ altına alınır (tmpfiles: 0750 havenfold-task:havenfold-podman);
# havenfold-podman grubunda yalnız havenfold-task ve denetçi vardır (sysusers.conf). İşçi çekirdeği konteyner
# başlatamaz (RFC-0007 §4.1). Denetçi bağlanır: podman --remote --url unix:///run/havenfold/podman/podman.sock
# (node/supervisor-main.js PODMAN_URL). Bu yol RFC'de yok; bu uygulamanın kararıdır.
#
# Kurulumun ayrıca yaptıkları (bu dosyanın dışında; installer ve havenfold-install-sudo.sh'te henüz yok):
#   - havenfold-task için /etc/subuid ve /etc/subgid aralıkları (systemd-sysusers bunları yazmaz; kök olmayan Podman
#     kullanıcı ad alanı için gerekir): usermod --add-subuids 100000-165535 --add-subgids 100000-165535 havenfold-task
#   - loginctl enable-linger havenfold-task (oturum açılmadan kullanıcı yöneticisi çalışsın)
#   - systemctl --user -M havenfold-task@ enable --now podman.socket
#   - cgroup v2'de havenfold-task'ın kullanıcı dilimine cpu, memory, pids denetleyicilerinin devredilmesi (--cpus,
#     --memory, --pids-limit için)
[Socket]
ListenStream=
ListenStream=/run/havenfold/podman/podman.sock
SocketMode=0660
SocketGroup=havenfold-podman
