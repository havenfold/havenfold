<!-- /usr/share/dbus-1/system.d/havenfold.conf — kutu çekirdeğinin afet modu (RFC-0012 §6.4; D91): havenfold-kutu
     kullanıcısı sistem veri yolunda yalnız BlueZ'e (org.bluez) çağrı gönderir. BlueZ'in GATT uygulamamıza ve reklam
     nesnemize yaptığı çağrılar (ReadValue, WriteValue, GetManagedObjects, Release) bluez'in kendi kuralıyla
     (bluetooth.conf, root) izinlidir. Ad sahiplenme yok. Dosya kurulunca dbus-daemon kendiliğinden yeniden okur. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="havenfold-kutu">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
