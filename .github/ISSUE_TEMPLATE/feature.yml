name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Changes to the protocol or the core need an RFC; if your idea is one, the "RFC proposal" form fits better.
        Havenfold follows the principles in the founding document §3 (no accounts, devices do not vote, visible
        monitoring, no lock-in); requests that break them are declined. You can write in English or Turkish.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who has the problem, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you suggest?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: scope
    attributes:
      label: Does it change the protocol or the core?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
